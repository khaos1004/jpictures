<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J Pictures</title>

<style>
/* ─────────────────────────────────────────────
   J Pictures 디자인 시스템
   콘셉트: 흰 무대 위의 IP — 휠로 흐르는 키비주얼 갤러리와 거울 바닥, 아웃라인 타이틀 띠, 박스 없는 여백 중심 레이아웃
   레이아웃: 모든 섹션은 .wrap.split (왼쪽 섹션 이름 / 오른쪽 본문) 한 가지 틀을 씁니다
   ───────────────────────────────────────────── */
:root {
  --bg: #ffffff;
  --bg-2: #f5f5f3;
  --fg: #111113;
  --mute: #8b8b92;
  --line: #e7e7e4;
  --ghost: #f0f0ee;
  --accent: #5b4bff;
  --sans: var(--font-noto, "Noto Sans KR"), "Apple SD Gothic Neo", system-ui, sans-serif;
  --latin: var(--font-sora, "Sora"), var(--font-noto, "Noto Sans KR"), system-ui, sans-serif;
  --hdr: 80px;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: var(--hdr); background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word; overflow-x: hidden; }
/* 일본어는 띄어쓰기가 없어 keep-all 이면 줄이 넘칩니다 → 글자 단위 줄바꿈 + 금칙 처리 */
html:lang(ja) body { word-break: normal; line-break: strict; }
/* 일본어 제목·짧은 문구는 구(phrase) 단위로 줄바꿈 (지원 브라우저) */
html:lang(ja) :is(h1, h2, h3, .statement, .title, .flow b, .card-cap b, .facts dt) { word-break: auto-phrase; }
html:lang(en) body { word-break: normal; hyphens: manual; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
h1, h2, h3, p, dl, dd, ol, ul { margin: 0; }
ul, ol { list-style: none; padding: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
h1, h2, h3 { letter-spacing: -0.035em; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
::selection { background: var(--fg); color: var(--bg); }

.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.sec { padding-block: clamp(96px, 12vw, 168px); }
.split { display: grid; grid-template-columns: clamp(140px, 15vw, 210px) minmax(0, 1fr); gap: clamp(24px, 4vw, 64px); }
.split > .label { padding-top: 10px; }
.split-body { min-width: 0; }
@media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); gap: 18px; } .split > .label { padding-top: 0; } }
.label { font-family: var(--latin); font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.title { font-size: clamp(30px, 4.2vw, 56px); font-weight: 800; line-height: 1.22; letter-spacing: -0.045em; }
.title em { font-style: normal; color: var(--accent); }
.lead { color: var(--mute); max-width: 520px; }
.tone { background-image: radial-gradient(rgba(255,255,255,.28) 1.1px, transparent 1.3px); background-size: 7px 7px; }

/* ── 헤더 ── */
.hdr { position: fixed; inset: 0 0 auto; top: env(safe-area-inset-top, 0px); z-index: 50; background: rgba(255,255,255,.92); backdrop-filter: blur(12px); border-bottom: 1px solid transparent; transition: border-color .3s; }
.hdr.is-solid { border-color: var(--line); }
.hdr-in { display: flex; align-items: center; justify-content: space-between; height: var(--hdr); }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark { display: block; width: 38px; height: 34px; flex: none; }
.logo-mark path { fill: var(--bg); stroke: var(--fg); stroke-width: 2.4; stroke-linejoin: round; }
.logo-mark text { fill: var(--fg); font-family: var(--latin); font-weight: 700; font-size: 15px; }
.wordmark { font-family: var(--latin); font-weight: 700; font-size: 20px; letter-spacing: -0.045em; white-space: nowrap; }
.wordmark em { font-style: normal; font-weight: 300; }
.hdr-right { display: flex; align-items: center; gap: clamp(16px, 2.6vw, 36px); }
.menu { display: flex; align-items: center; gap: clamp(22px, 2.8vw, 44px); }
.menu a { position: relative; font-family: var(--latin); font-size: 14px; font-weight: 700; letter-spacing: .02em; padding-block: 6px; }
.menu a::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--fg); transform: scaleX(0); transform-origin: left; transition: transform .3s; }
.menu a:hover::after { transform: scaleX(1); }
.burger { display: none; width: 42px; height: 42px; background: none; border: 0; cursor: pointer; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.burger span { width: 22px; height: 2px; background: var(--fg); transition: transform .2s; }
.burger[aria-expanded="true"] span:first-child { transform: translateY(4px) rotate(45deg); }
.burger[aria-expanded="true"] span:last-child { transform: translateY(-4px) rotate(-45deg); }
.mmenu { display: flex; flex-direction: column; padding-block: 8px 24px; border-top: 1px solid var(--line); background: var(--bg); }
.mmenu a { padding: 10px 0; font-family: var(--latin); font-weight: 700; font-size: 26px; letter-spacing: -0.03em; }
/* 언어 선택: KO · EN · JA */
.lang { display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
.lang a { min-width: 34px; padding: 5px 8px; border-radius: 999px; text-align: center; font-family: var(--latin); font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--mute); transition: background .2s, color .2s; }
.lang a:hover { color: var(--fg); }
.lang a[aria-current="true"] { background: var(--fg); color: var(--bg); }
@media (max-width: 1080px) { .menu { display: none; } .burger { display: flex; } .hdr-right { gap: 8px; } }
@media (max-width: 400px) { .wrap { padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); } }
@media (max-width: 360px) {
  .lang { padding: 2px; } .lang a { min-width: 28px; padding: 4px 5px; font-size: 11px; }
  .logo-mark { width: 32px; height: 29px; } .wordmark { font-size: 17px; } .logo { gap: 7px; }
  .burger { width: 36px; }
}

/* ── 히어로: 스크롤로 흐르는 가로 갤러리 ── */
/* 세로 스크롤(휠) 거리만큼 카드 줄이 가로로 이동하고, 카드 안 그림은 반대로 살짝 밀려 패럴랙스가 생깁니다 */
.hero { position: relative; }
.hero-stage { position: relative; height: 100vh; height: 100svh; min-height: 560px; max-height: 1100px; overflow: hidden; display: flex; flex-direction: column; padding-top: calc(var(--hdr) + env(safe-area-inset-top, 0px)); }
.hero-word { position: absolute; left: 0; right: 0; top: calc(var(--hdr) + 3vh); text-align: center; font-family: var(--latin); font-weight: 700; font-size: clamp(64px, 13vw, 210px); line-height: 1; letter-spacing: -0.065em; color: var(--ghost); white-space: nowrap; pointer-events: none; user-select: none; }
.track-wrap { position: relative; flex: 1; display: flex; align-items: flex-start; min-height: 0; padding-top: clamp(16px, 5vh, 56px); cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.track-wrap.is-dragging { cursor: grabbing; }
.track-wrap img, .track-wrap * { -webkit-user-drag: none; }
.track { --cw: clamp(230px, 24vw, 360px); display: flex; gap: clamp(20px, 3vw, 48px); will-change: transform; }
@media (max-width: 700px) { .track { --cw: 68vw; gap: 18px; } }
.card { flex: none; width: var(--cw); }
.card-cap { display: grid; gap: 2px; margin-bottom: 14px; min-width: 0; }
.card-cap b { font-size: clamp(17px, 1.5vw, 21px); font-weight: 800; line-height: 1.35; letter-spacing: -0.035em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-cap span { font-size: 13px; line-height: 1.4; color: var(--mute); white-space: nowrap; }
.card-stand { position: relative; }
.card-frame { position: relative; height: min(50vh, calc(var(--cw) * 1.38)); max-width: 100%; border-radius: 14px; overflow: hidden; background: #111; }
.card-stand { perspective: 1100px; }
.card-stand > .card-frame { box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 30px 50px -30px rgba(0,0,0,.45); }
.card-stand > .card-frame, .mirror .card-frame { transition: transform .55s cubic-bezier(.2,.8,.2,1), box-shadow .55s, filter .45s; transform-style: preserve-3d; will-change: transform; }

/* ── 마우스를 올린 작품: 카드처럼 떠오르기 ── */
.card { --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 30%; transition: opacity .45s; }
.card-cap b, .card-cap span { transition: color .3s; }
.card.is-hover .card-cap b { color: var(--accent); }
.card.is-hover .card-stand > .card-frame {
  transform: translateY(-18px) rotateX(var(--rx)) rotateY(var(--ry)) scale(1.05);
  transition-duration: .35s, .55s, .45s;
  box-shadow: 0 0 0 1px rgba(255,255,255,.7) inset, 0 50px 70px -28px rgba(17,17,30,.55), 0 20px 30px -20px rgba(91,75,255,.35);
}
.card.is-hover .mirror .card-frame { transform: translateY(-18px) rotateX(calc(var(--rx) * -1)) rotateY(var(--ry)) scale(1.05); transition-duration: .35s; }
.track.has-hover .card:not(.is-hover) .card-frame { filter: saturate(.55) brightness(.93); }
.track.has-hover .card:not(.is-hover) .mirror .card-frame { filter: blur(.6px) saturate(.5) brightness(.93); }
/* 커서를 따라 움직이는 빛 */
.glare { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; mix-blend-mode: soft-light; background: radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,.85), rgba(255,255,255,0) 55%); transition: opacity .4s; }
.card.is-hover .glare { opacity: 1; }
/* 작품 정보: 아래에서 떠오름 */
.card-info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; flex-direction: column; gap: 2px; padding: 48px 18px 18px; color: #fff; background: linear-gradient(to top, rgba(8,8,14,.82), rgba(8,8,14,0)); opacity: 0; transform: translateY(14px); transition: opacity .4s, transform .5s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
.card.is-hover .card-info { opacity: 1; transform: none; }
.card-status { align-self: flex-start; margin-bottom: 8px; padding: 3px 10px; border-radius: 999px; background: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .02em; }
.card-info b { font-size: clamp(18px, 1.6vw, 22px); font-weight: 800; line-height: 1.3; letter-spacing: -0.035em; }
.card-en { font-family: var(--latin); font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; opacity: .75; }
.card-inner { position: absolute; top: 0; bottom: 0; left: -12%; width: 124%; background-size: cover; background-repeat: no-repeat; will-change: transform; }
.card-inner .scene { position: absolute; inset: 0; }
.scene-sun { position: absolute; top: 14%; width: 34%; aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); }
.scene-horizon { position: absolute; left: 0; right: 0; top: 62%; height: 2px; background: rgba(255,255,255,.4); }
.scene-word { position: absolute; left: 4%; bottom: 7%; font-family: var(--latin); font-weight: 700; font-size: calc(var(--cw) * 0.36); line-height: .9; letter-spacing: -0.06em; color: transparent; -webkit-text-stroke: 1.2px rgba(255,255,255,.4); white-space: nowrap; }
.card-inner .tone { position: absolute; inset: 0; opacity: .45; mix-blend-mode: overlay; }
.card-tag { position: absolute; left: 14px; top: 12px; z-index: 2; font-family: var(--latin); font-size: 11px; font-weight: 600; letter-spacing: .16em; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
/* 유광 하이라이트: 카드 윗면에 비스듬히 지나가는 빛 */
.card-stand > .card-frame::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(115deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 32%, rgba(255,255,255,0) 68%, rgba(255,255,255,.08) 100%); }

/* ── 거울 바닥 반사 ── */
.mirror { position: absolute; left: 0; right: 0; top: calc(100% + 2px); pointer-events: none; transform: scaleY(-1); transform-origin: 50% 50%; }
.mirror .card-frame { border-radius: 14px; filter: blur(.6px) saturate(1.1); -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.42) 0%, rgba(0,0,0,.16) 22%, rgba(0,0,0,0) 46%); mask-image: linear-gradient(to top, rgba(0,0,0,.42) 0%, rgba(0,0,0,.16) 22%, rgba(0,0,0,0) 46%); }
.mirror .card-tag { display: none; }
.mirror { perspective: 1100px; }
/* 바닥면: 카드가 서 있는 선과 은은한 광택 */
.floor { position: absolute; left: 0; right: 0; z-index: 0; pointer-events: none; height: 1px; background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.12) 20%, rgba(0,0,0,.12) 80%, rgba(0,0,0,0)); }
.floor::after { content: ""; position: absolute; left: 0; right: 0; top: 1px; height: 26vh; background: linear-gradient(to bottom, rgba(17,17,19,.03), rgba(17,17,19,0)); -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); }
.track { position: relative; z-index: 1; }

.hero-bar { position: relative; z-index: 2; width: 100%; display: grid; grid-template-columns: 1fr minmax(0, 2fr) 1fr; align-items: center; gap: 20px; padding-bottom: clamp(24px, 4vh, 44px); }
.hb-idx { min-width: 0; font-family: var(--latin); font-size: 13px; font-weight: 600; color: var(--mute); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-idx b { color: var(--fg); font-size: 15px; }
.hb-title { font-size: 15px; font-weight: 700; margin-left: 10px; color: var(--fg); }
.progress { position: relative; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { position: absolute; inset: 0; background: var(--fg); transform-origin: left; transform: scaleX(0); }
.hb-ctrl { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.hb-ctrl button { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--fg); background: var(--bg); cursor: pointer; font-size: 17px; transition: background .2s, color .2s; }
.hb-ctrl button:hover { background: var(--fg); color: var(--bg); }
.hint { position: absolute; z-index: 2; left: 50%; bottom: calc(clamp(24px, 4vh, 44px) + 60px); transform: translateX(-50%); font-family: var(--latin); font-size: 11px; font-weight: 600; letter-spacing: .2em; color: var(--mute); transition: opacity .4s; pointer-events: none; }
/* 태블릿: 카드를 키워 빈 공간을 줄임 */
@media (min-width: 701px) and (max-width: 1100px) { .track { --cw: clamp(260px, 38vw, 380px); } }
/* 폰 */
@media (max-width: 700px) {
  :root { --hdr: 64px; }
  .hero-word { display: none; }
  .hint { bottom: calc(clamp(24px, 4vh, 44px) + 118px); }
  .card-cap b { font-size: 16px; }
  .hero-bar { grid-template-columns: 1fr auto; }
  .progress { grid-column: 1 / -1; grid-row: 2; }
  .hb-title { display: none; }
}

/* 가로로 눕힌 폰 등 세로가 낮은 화면: 카드 크기를 화면 높이에 맞춤 */
@media (max-height: 520px) {
  :root { --hdr: 60px; }
  .hero-stage { min-height: 0; }
  .hero-word, .hint { display: none; }
  .track-wrap { padding-top: 10px; }
  .track { --cw: calc((100svh - var(--hdr) - 150px) / 1.3); }
  .card-frame { height: calc(100svh - var(--hdr) - 150px); }
  .card-cap { margin-bottom: 8px; }
  .card-cap span { display: none; }
  .card-cap b { font-size: 13px; }
  .hero-bar { padding-bottom: 12px; }
  .hb-ctrl button { width: 40px; height: 40px; }
}

/* ── IP 타이틀 띠 ── */
.logos { border-block: 1px solid var(--line); overflow: hidden; padding-block: 30px; background: var(--bg); }
.logos-track { display: flex; width: max-content; animation: flow 42s linear infinite; }
.logos:hover .logos-track { animation-play-state: paused; }
.logo-item { display: flex; align-items: baseline; gap: 14px; padding-right: 72px; white-space: nowrap; }
.logo-item b { font-weight: 700; font-size: clamp(30px, 3.6vw, 48px); letter-spacing: -0.04em; color: transparent; -webkit-text-stroke: 1px var(--fg); transition: color .3s; }
.logo-item span { font-family: var(--latin); font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
.logo-item:hover b { color: var(--fg); }
@keyframes flow { to { transform: translateX(-50%); } }

/* ── ABOUT ── */
.statement { font-size: clamp(30px, 4.8vw, 66px); font-weight: 800; line-height: 1.22; letter-spacing: -0.05em; }
.statement em { font-style: normal; color: var(--accent); }
.about-sub { margin-top: clamp(44px, 6vw, 72px); display: grid; grid-template-columns: 1fr 1fr; gap: clamp(32px, 5vw, 80px); align-items: start; }
@media (max-width: 760px) { .about-sub { grid-template-columns: 1fr; } }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px clamp(24px, 4vw, 56px); }
.facts > div { display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; }
.facts dt { font-size: 13px; line-height: 1.45; color: var(--mute); }
.facts dd { font-family: var(--latin); font-weight: 600; font-size: clamp(36px, 4vw, 52px); line-height: 1.1; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
.values { margin-top: clamp(72px, 8vw, 112px); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(28px, 4vw, 56px); }
@media (max-width: 800px) { .values { grid-template-columns: 1fr; } }
.values li { border-top: 2px solid var(--fg); padding-top: 20px; }
.values small { font-family: var(--latin); font-size: 12px; font-weight: 700; color: var(--mute); }
.values h3 { margin-top: 18px; font-size: clamp(19px, 1.7vw, 22px); font-weight: 800; line-height: 1.35; }
.values p { margin-top: 10px; color: var(--mute); font-size: 15px; }

/* ── BUSINESS ── */
.biz-sec { background: var(--bg-2); }
.sec-head { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: end; gap: 24px clamp(32px, 5vw, 72px); margin-bottom: clamp(48px, 6vw, 76px); }
@media (max-width: 1000px) { .sec-head { grid-template-columns: minmax(0, 1fr); } }
.biz { border-top: 1px solid var(--fg); }
.biz li { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: center; padding-block: clamp(28px, 3.4vw, 40px); border-bottom: 1px solid #d9d9d5; }
.biz .word { font-family: var(--latin); font-weight: 700; font-size: clamp(44px, 5.6vw, 84px); line-height: 1; letter-spacing: -0.065em; color: transparent; -webkit-text-stroke: 1.2px var(--fg); transition: color .35s; }
.biz li:hover .word { color: var(--fg); }
.biz h3 { font-size: clamp(20px, 1.9vw, 24px); font-weight: 800; line-height: 1.35; }

      var ok = ["f-name", "f-email", "f-msg"].every(function (id) { return document.getElementById(id).value.trim(); });
      var note = document.getElementById("note");
      note.hidden = false;
      note.textContent = ok ? t.contact.demo : t.contact.missing;
    };
  }

  render(pickLang());
  window.addEventListener("hashchange", function () {
    var h = location.hash.slice(1);
    if (LANGS.indexOf(h) >= 0 && h !== document.documentElement.lang) render(h);
  });
})();
</script>

</html>
